<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Feather Atlas · Specimen Field Guide</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <style>
    :root {
      --bg: #f6f1e7;
      --panel: #fbf8f1;
      --line: #e7e0d1;
      --ink: #1b1a17;
      --muted: #6d685d;
      --sage: #4d5a3d;
      --sage-ink: #ffffff;
      --sage-tint: #e9ebdc;
      --chip: #efeadd;
      --shadow: 60, 48, 28;
      --ease: cubic-bezier(.22, .8, .24, 1);
    }

    .hero[data-light="dusk"] {
      --bg: #14170f;
      --panel: #1b1f15;
      --line: #2d3324;
      --ink: #f2ecdf;
      --muted: #a8a392;
      --sage: #a9b98a;
      --sage-ink: #14170f;
      --sage-tint: #283020;
      --chip: #262b1d;
      --shadow: 0, 0, 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
      transition: background-color 0.6s var(--ease), color 0.6s var(--ease);
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    button {
      background: none;
      border: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible, a:focus-visible, div[tabindex="0"]:focus-visible {
      outline: 2px solid var(--sage);
      outline-offset: 2px;
    }

    /* SVG Icon symbols */
    .icon {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    /* Hero layout */
    .hero {
      position: relative;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 196px minmax(0, 1fr) clamp(300px, 27vw, 356px);
      background: var(--bg);
      color: var(--ink);
      transition: background 0.6s var(--ease), color 0.6s var(--ease);
    }

    /* Full-hero Canvas */
    #gl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    /* 1) Left sidebar */
    aside.sidebar {
      display: flex;
      flex-direction: column;
      padding: 22px 12px 18px 24px;
      border-right: 1px solid var(--line);
      z-index: 6;
      transition: transform 0.5s var(--ease), opacity 0.5s var(--ease), border-color 0.6s var(--ease);
      position: relative;
    }

    .brand {
      font-family: "Newsreader", "Iowan Old Style", Georgia, serif;
      font-size: 26px;
      letter-spacing: -0.01em;
      font-weight: 500;
      color: var(--ink);
    }

    .nav-list {
      margin: 20px 0 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--ink);
      transition: background 0.2s;
      text-align: left;
      width: 100%;
    }

    .nav-item:hover {
      background: var(--chip);
    }

    .nav-item[aria-current="page"] {
      background: var(--sage-tint);
    }

    .nav-item small {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      font-weight: 400;
    }

    .featured-card {
      margin-top: auto;
      background: var(--sage-tint);
      border-radius: 10px;
      padding: 14px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: background 0.6s var(--ease);
    }

    .featured-card .eyebrow {
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    .featured-card img {
      width: 92px;
      height: 76px;
      object-fit: contain;
      align-self: center;
      transition: opacity 0.3s;
    }

    .featured-card h4 {
      font-family: "Newsreader", Georgia, serif;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.2;
    }

    .featured-card p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .featured-card a {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      text-decoration: underline;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    /* 2) Centre column */
    section.main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      padding: 48px 18px 14px 26px;
      position: relative;
      z-index: 6;
      pointer-events: none;
    }

    .main > * {
      pointer-events: auto;
    }

    /* Tabs row */
    .tabs-row {
      display: flex;
      gap: 10px;
      z-index: 6;
      transition: transform 0.5s var(--ease), opacity 0.5s var(--ease);
    }

    .tab-btn {
      width: 130px;
      padding: 8px 8px 11px;
      display: grid;
      justify-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      transition: transform 0.2s var(--ease), background 0.3s, border-color 0.3s;
    }

    .tab-btn:hover {
      transform: translateY(-2px);
    }

    .tab-btn[aria-selected="true"] {
      background: var(--sage-tint);
      border-color: color-mix(in srgb, var(--sage) 45%, transparent);
    }

    .tab-btn img {
      width: 58px;
      height: 52px;
      object-fit: contain;
    }

    .tab-btn .tab-name {
      font-family: "Newsreader", Georgia, serif;
      font-size: 15.5px;
      font-weight: 500;
      margin-top: 2px;
    }

    .tab-btn .tab-latin {
      font-family: "Newsreader", Georgia, serif;
      font-style: italic;
      font-size: 12.5px;
      color: var(--muted);
    }

    /* Stage */
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
      user-select: none;
      outline: none;
    }

    #stage.grabbing {
      cursor: grabbing;
    }

    /* a) Ground shadow */
    .ground-shadow {
      position: absolute;
      left: 50%;
      bottom: 15%;
      transform: translateX(-50%);
      width: min(62%, 460px);
      height: 44px;
      background: radial-gradient(closest-side, rgba(var(--shadow), 0.22), transparent);
      pointer-events: none;
      transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
      z-index: 1;
    }

    .ground-shadow.switching {
      opacity: 0;
      transform: translateX(-50%) scaleX(0.4);
    }

    /* b) Loader */
    .stage-loader {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      z-index: 10;
    }

    .stage-loader.visible {
      opacity: 1;
    }

    .spinner-ring {
      width: 30px;
      height: 30px;
      border: 1.5px solid var(--line);
      border-top-color: var(--sage);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .stage-loader span {
      font-size: 12.5px;
      color: var(--muted);
    }

    /* c) Fallback */
    .stage-fallback {
      position: absolute;
      left: 50%;
      top: 44%;
      transform: translate(-50%, -50%);
      max-width: 50%;
      max-height: 50%;
      object-fit: contain;
      pointer-events: none;
      display: none;
      z-index: 2;
    }

    /* d) Hint */
    .stage-hint {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--muted);
      pointer-events: none;
      transition: opacity 0.4s;
      z-index: 6;
    }

    .stage-hint.hidden {
      opacity: 0;
    }

    /* e) Icon rail */
    .icon-rail {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      gap: 9px;
      z-index: 6;
    }

    .rail-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--panel);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, background 0.2s, color 0.2s, transform 0.1s;
    }

    .rail-btn .icon {
      width: 17px;
      height: 17px;
    }

    .rail-btn:hover {
      border-color: var(--sage);
    }

    .rail-btn:active {
      transform: scale(0.92);
    }

    .rail-btn.on {
      background: var(--sage);
      color: var(--sage-ink);
      border-color: var(--sage);
    }

    /* f) Turn pill */
    .turn-pill {
      position: absolute;
      bottom: 46px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 6px;
      font-size: 13px;
      font-weight: 600;
      z-index: 6;
      box-shadow: 0 4px 16px rgba(var(--shadow), 0.08);
      transition: background 0.6s var(--ease), border-color 0.6s var(--ease);
    }

    .turn-pill button {
      padding: 4px 8px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
    }

    .turn-pill button:hover {
      background: var(--chip);
    }

    /* g) Caption */
    .stage-caption {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      font-family: "Newsreader", Georgia, serif;
      font-style: italic;
      font-size: clamp(16px, 1.55vw, 20px);
      color: var(--ink);
      white-space: nowrap;
      pointer-events: none;
      z-index: 6;
      transition: opacity 0.3s;
    }

    /* 3) Right column */
    section.info {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 16px;
      padding: 13px 26px 14px 0;
      z-index: 6;
      transition: transform 0.5s var(--ease), opacity 0.5s var(--ease);
      position: relative;
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box {
      flex: 1;
      height: 32px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      transition: border-color 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--sage);
    }

    .search-box input {
      background: none;
      border: none;
      font-size: 11.5px;
      color: var(--ink);
      width: 100%;
      outline: none;
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    .action-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: border-color 0.2s, background 0.2s;
    }

    .action-btn:hover {
      border-color: var(--sage);
    }

    .user-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-avatar .icon {
      width: 15px;
      height: 15px;
      stroke: var(--bg);
    }

    /* Detail card */
    .detail-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 22px 20px 16px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
      display: flex;
      flex-direction: column;
      transition: background 0.6s var(--ease), border-color 0.6s var(--ease);
    }

    .detail-card::-webkit-scrollbar {
      width: 4px;
    }
    .detail-card::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 4px;
    }

    .detail-article {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .family-eyebrow {
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    .bird-h1 {
      font-family: "Newsreader", Georgia, serif;
      font-weight: 500;
      font-size: clamp(40px, 4.2vw, 54px);
      line-height: 1;
      letter-spacing: -0.025em;
      margin-top: 8px;
      color: var(--ink);
    }

    .tag-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 16px;
    }

    .tag-pill {
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 13px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--ink);
    }

    .bird-desc {
      font-size: 13.5px;
      line-height: 1.55;
      text-wrap: pretty;
      margin-top: 16px;
      color: var(--ink);
    }

    .detail-h2 {
      font-family: "Newsreader", Georgia, serif;
      font-weight: 400;
      font-size: 21px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
      margin-top: 20px;
      color: var(--ink);
    }

    .traits-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }

    .trait-row {
      display: grid;
      grid-template-columns: 22px 88px 1fr;
      gap: 16px;
      font-size: 13px;
      align-items: center;
    }

    .trait-row .muted-lbl {
      color: var(--muted);
    }

    .trait-row .val {
      font-weight: 600;
      color: var(--ink);
    }

    .habitat-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      margin-top: 10px;
      color: var(--ink);
    }

    /* Close-up detail button */
    .close-up-btn {
      margin-top: auto;
      padding-top: 16px;
      display: grid;
      grid-template-columns: 76px 1fr 18px;
      gap: 14px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      align-items: center;
      text-align: left;
      background: var(--panel);
      transition: border-color 0.2s, background 0.2s;
    }

    .close-up-btn:hover, .close-up-btn[aria-pressed="true"] {
      border-color: var(--sage);
      background: var(--sage-tint);
    }

    .lens-circle {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background-repeat: no-repeat;
      background-size: 520%;
      background-color: var(--chip);
    }

    .close-up-info h3 {
      font-family: "Newsreader", Georgia, serif;
      font-size: 18px;
      font-weight: 500;
      color: var(--ink);
    }

    .close-up-info p {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.35;
    }

    .close-up-chevron {
      transition: transform 0.3s var(--ease);
      color: var(--muted);
    }

    .close-up-btn[aria-pressed="true"] .close-up-chevron {
      transform: rotate(180deg);
      color: var(--sage);
    }

    /* Focus Mode */
    .hero.focus aside.sidebar {
      transform: translateX(-24px);
      opacity: 0;
      pointer-events: none;
    }

    .hero.focus section.info {
      transform: translateX(24px);
      opacity: 0;
      pointer-events: none;
    }

    .hero.focus .tabs-row {
      transform: translateY(-16px);
      opacity: 0;
      pointer-events: none;
    }

    /* TABLET (<1100px) */
    @media (max-width: 1100px) {
      .hero {
        grid-template-columns: minmax(0, 1fr) clamp(280px, 36vw, 340px);
      }
      aside.sidebar {
        display: none !important;
      }
      section.main {
        padding-left: 20px;
      }
    }

    /* PHONE (<=760px) */
    @media (max-width: 760px) {
      .hero {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
      }

      /* Mobile Top Bar */
      .mobile-top-bar {
        display: flex !important;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px 0;
        z-index: 8;
      }

      .mobile-brand {
        font-family: "Newsreader", Georgia, serif;
        font-size: 21px;
        font-weight: 500;
      }

      .mobile-top-actions {
        display: flex;
        gap: 8px;
      }

      section.info .top-row {
        display: none;
      }

      section.main {
        flex: 1;
        padding: 10px 14px 6px;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .tabs-row {
        width: 100%;
      }

      .tab-btn {
        flex: 1;
        width: 50%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 10px;
      }

      .tab-btn img {
        width: 44px;
        height: 40px;
      }

      .tab-btn .tab-text-stack {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .tab-btn .tab-name {
        font-size: 15px;
      }

      .tab-btn .tab-latin {
        font-size: 12px;
      }

      .rail-btn {
        width: 34px;
        height: 34px;
      }
      .icon-rail {
        gap: 7px;
      }

      .turn-pill {
        bottom: 30px;
      }

      .stage-caption {
        font-size: 15px;
      }

      .stage-hint {
        display: none;
      }

      .ground-shadow {
        bottom: 17%;
        height: 30px;
      }

      /* Bottom Sheet detail card */
      section.info {
        padding: 0;
        z-index: 7;
        position: relative;
      }

      .detail-card {
        max-height: 40dvh;
        border-radius: 16px 16px 0 0;
        border-left: none;
        border-right: none;
        border-bottom: none;
        padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      }

      .bird-h1 {
        font-size: 34px;
      }
      .detail-h2 {
        font-size: 19px;
      }

      /* Focus mode on phone */
      .hero.focus .detail-card {
        transform: translateY(100%);
        opacity: 0;
        pointer-events: none;
      }
      .hero.focus .mobile-top-bar {
        opacity: 0;
        pointer-events: none;
      }
    }

    @media (min-width: 761px) {
      .mobile-top-bar {
        display: none !important;
      }
    }

    /* Short Desktop (max-height 620px) */
    @media (max-height: 620px) and (min-width: 761px) {
      aside.sidebar {
        padding-top: 12px;
      }
      section.main {
        padding-top: 16px;
      }
      .featured-card img, .featured-card p {
        display: none;
      }
    }

    /* prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- SVG Sprite sheet -->
  <svg style="display: none;">
    <symbol id="icon-house" viewBox="0 0 24 24">
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </symbol>
    <symbol id="icon-star" viewBox="0 0 24 24">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </symbol>
    <symbol id="icon-bird" viewBox="0 0 24 24">
      <path d="M16 7h.01M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 18z"/>
      <path d="m20 7 2 .5-2 .5"/>
    </symbol>
    <symbol id="icon-owl" viewBox="0 0 24 24">

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ASSETS
    const CDN = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/";
    const BIRDS = [
      {
        id: "hoopoe",
        name: "Hoopoe",
        latin: "Upupa epops",
        family: "UPUPIDAE",
        tags: ["Ground forager", "Crested", "Migrant"],
        image: CDN + "hf_20261004_073256_21ed095c-d038-4ab5-87b7-b44e527ec449.png",
        model: CDN + "hf_20261004_073347_06b339a7-70bc-4ecd-9e72-1a4143264da9.glb",
        desc: "Unmistakable in cinnamon, black and white, the hoopoe walks open ground probing for grubs with its long curved bill. It lifts its crest into a fan when it lands or takes fright, and flies on broad wings with a loose, butterfly-like beat.",
        traits: [
          { icon: "#icon-ruler", label: "Length", value: "25–29 cm" },
          { icon: "#icon-wing", label: "Wingspan", value: "44–48 cm" },
          { icon: "#icon-fish", label: "Diet", value: "Insects, larvae and grubs" },
          { icon: "#icon-globe", label: "Range", value: "Europe, Asia and Africa" }
        ],
        habitat: "Orchards, vineyards and dry grassland.",
        caption: "A crown raised, and the orchard takes notice.",
        closeupText: "Every crest feather ends in a black tip, so the raised fan reads like a row of signal flags.",
        lensPos: "62% 22%",
        featured: {
          title: "A crown of cinnamon.",
          desc: "Bold bars on broad wings. A call you hear before you see it."
        }
      },
      {
        id: "kingfisher",
        name: "Kingfisher",
        latin: "Alcedo atthis",
        family: "ALCEDINIDAE",
        tags: ["River bird", "Diver", "Iridescent"],
        image: CDN + "hf_20261004_073256_f9e3e60d-acdc-4925-b393-c4ce14b28711.png",
        model: CDN + "hf_20261004_073345_12721630-c589-442f-8884-e4a445cd8980.glb",
        desc: "A small, spectacular bird of rivers and lakes, the kingfisher is renowned for its dazzling plumage and astonishing hunting dives. A master of stealth and speed, it links healthy waterways with extraordinary beauty.",
        traits: [
          { icon: "#icon-ruler", label: "Length", value: "16–17 cm" },
          { icon: "#icon-gauge", label: "Dive speed", value: "Up to 40 km/h" },
          { icon: "#icon-fish", label: "Diet", value: "Small fish and insects" },
          { icon: "#icon-globe", label: "Range", value: "Europe and Asia" }
        ],
        habitat: "Slow rivers, streams and lakes.",
        caption: "Blink, and the river keeps its secret.",
        closeupText: "An intricate mosaic of structure and colour gives the kingfisher its unmistakable sheen.",
        lensPos: "24% 30%",
        featured: {
          title: "A flash of river blue.",
          desc: "Extraordinary colours. A remarkable life by the water."
        }
      }
    ];

    // State
    let activeIndex = 1; // Kingfisher selected by default
    let isDusk = false;
    let isFocus = false;
    let targetZoom = 1.0;
    let curZoom = 1.0;
    let turnQueue = 0;
    let hasInteracted = false;
    let lastInteractionTime = performance.now();

    // Elements
    const heroEl = document.querySelector('.hero');
    const stageEl = document.getElementById('stage');
    const canvasEl = document.getElementById('gl');
    const shadowEl = document.getElementById('ground-shadow');
    const loaderEl = document.getElementById('stage-loader');
    const fallbackEl = document.getElementById('stage-fallback');
    const hintEl = document.getElementById('stage-hint');
    const captionEl = document.getElementById('stage-caption');
    const featImg = document.getElementById('feat-img');
    const featTitle = document.getElementById('feat-title');
    const featDesc = document.getElementById('feat-desc');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const btnExpand = document.getElementById('btn-expand');
    const btnLight = document.getElementById('btn-light');
    const btnCloseUp = document.getElementById('btn-close-up');
    const lensCircle = document.getElementById('lens-circle');
    const lensDesc = document.getElementById('lens-desc');
    const tabHoopoe = document.getElementById('tab-hoopoe');
    const tabKingfisher = document.getElementById('tab-kingfisher');

    // THREE.JS SETUP
    const renderer = new THREE.WebGLRenderer({
      canvas: canvasEl,
      alpha: true,
      antialias: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.toneMapping = THREE.NeutralToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 100);
    camera.position.set(0, 0, 5);
    camera.lookAt(0, 0, 0);

    // Environment & PMREM
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    const roomEnv = new RoomEnvironment();
    const envRenderTarget = pmremGenerator.fromScene(roomEnv, 0.04);
    scene.environment = envRenderTarget.texture;
    scene.environmentIntensity = 0.95;

    // Lights
    const keyLight = new THREE.DirectionalLight(0xfff4e2, 1.6);
    keyLight.position.set(2.5, 4, 5);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xbfd8ff, 0.5);
    rimLight.position.set(-4, 2, -3);
    scene.add(rimLight);

    // Rig setup for birds
    // Home orientation: Euler YXZ, yaw 0.75 rad, pitch 0.12 rad
    const homeQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.12, 0.75, 0, 'YXZ'));

    const rigs = BIRDS.map((b, i) => {
      const pivot = new THREE.Group();
      const spin = new THREE.Group();
      const holder = new THREE.Group();
      spin.quaternion.copy(homeQuat);
      pivot.add(spin);
      spin.add(holder);
      scene.add(pivot);

      return {
        bird: b,
        index: i,
        pivot,
        spin,
        holder,
        loaded: false,
        failed: false,
        spinVel: new THREE.Vector2(0, 0)
      };
    });

    // GLTF Loaders
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);
    gltfLoader.setMeshoptDecoder(MeshoptDecoder);

    const maxAniso = renderer.capabilities.getMaxAnisotropy();

    function loadBirdModel(idx) {
      const rig = rigs[idx];
      return new Promise((resolve) => {
        if (rig.loaded) return resolve(true);

        gltfLoader.load(
          rig.bird.model,
          (gltf) => {
            const root = gltf.scene;

            // Compute bounding sphere and center
            const box = new THREE.Box3().setFromObject(root);
            const sphere = new THREE.Sphere();
            box.getBoundingSphere(sphere);

            root.position.sub(sphere.center);
            const scale = 1 / Math.max(sphere.radius, 0.0001);
            rig.holder.scale.setScalar(scale);

            root.traverse((child) => {
              if (child.isMesh) {
                child.frustumCulled = false;
                if (child.material) {
                  if (child.material.map) child.material.map.anisotropy = maxAniso;
                  child.material.needsUpdate = true;
                }
              }
            });

            rig.holder.add(root);
            rig.loaded = true;
            resolve(true);
          },
          undefined,
          (err) => {
            console.error(`Failed to load 3D model for ${rig.bird.name}:`, err);
            rig.failed = true;
            resolve(false);
          }
        );
      });
    }

    // Framing variables
    let heroW = window.innerWidth;
    let heroH = window.innerHeight;
    let stageBounds = { x: 0, y: 0, w: 100, h: 100 };
    let curCx = heroW * 0.5;
    let curCy = heroH * 0.5;
    let curPx = 200;

    function updateBounds() {
      const heroRect = heroEl.getBoundingClientRect();
      heroW = heroRect.width;
      heroH = heroRect.height;

      const stageRect = stageEl.getBoundingClientRect();
      stageBounds = {
        x: stageRect.left - heroRect.left,
        y: stageRect.top - heroRect.top,
        w: stageRect.width,
        h: stageRect.height
      };

      renderer.setSize(heroW, heroH, false);
    }

    const ro = new ResizeObserver(() => updateBounds());
    ro.observe(heroEl);
    ro.observe(stageEl);
    updateBounds();

    // UI Updates
    function updateDetails(idx, animate = true) {
      const bird = BIRDS[idx];

      // Side info animation
      const article = document.getElementById('detail-article');
      const children = Array.from(article.children);

      const applyData = () => {
        document.getElementById('bird-family').textContent = bird.family;
        document.getElementById('bird-name').textContent = bird.name;
        document.getElementById('bird-desc').textContent = bird.desc;

        const tagsEl = document.getElementById('bird-tags');
        tagsEl.innerHTML = '';
        bird.tags.forEach(t => {
          const s = document.createElement('span');
          s.className = 'tag-pill';
          s.textContent = t;
          tagsEl.appendChild(s);
        });

        const traitsEl = document.getElementById('bird-traits');
        traitsEl.innerHTML = '';
        bird.traits.forEach(t => {
          const row = document.createElement('div');
          row.className = 'trait-row';
          row.innerHTML = `
            <svg class="icon"><use href="${t.icon}"/></svg>
            <span class="muted-lbl">${t.label}</span>
            <span class="val">${t.value}</span>
          `;
          traitsEl.appendChild(row);
        });

        const habEl = document.getElementById('bird-habitat');
        habEl.innerHTML = `
          <svg class="icon"><use href="#icon-reed"/></svg>
          <span>${bird.habitat}</span>
        `;

        // Update lens & featured card
        lensCircle.style.backgroundImage = `url("${bird.image}")`;
        lensCircle.style.backgroundPosition = bird.lensPos;
        lensDesc.textContent = bird.closeupText;

        captionEl.textContent = bird.caption;
        featImg.src = bird.image;
        featTitle.textContent = bird.featured.title;
        featDesc.textContent = bird.featured.desc;
      };

      if (!animate || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        applyData();
        return;
      }

      // Animate out
      children.forEach(c => {
        c.style.transition = 'opacity 0.2s ease-in, transform 0.2s ease-in';
        c.style.opacity = '0';
        c.style.transform = 'translateY(-6px)';
      });

      setTimeout(() => {
        applyData();
        children.forEach((c, i) => {
          c.style.transition = `opacity 0.6s var(--ease) ${i * 45}ms, transform 0.6s var(--ease) ${i * 45}ms`;
          c.style.opacity = '1';
          c.style.transform = 'translateY(0)';
        });
      }, 200);
    }

    // Tab buttons state
    function updateTabs() {
      tabHoopoe.setAttribute('aria-selected', activeIndex === 0 ? 'true' : 'false');
      tabKingfisher.setAttribute('aria-selected', activeIndex === 1 ? 'true' : 'false');
    }

    // Tab Switch Transition
    let tabSwitch = null;

    function switchTab(newIndex) {
      if (newIndex === activeIndex || tabSwitch) return;
      const oldIndex = activeIndex;
      activeIndex = newIndex;
      updateTabs();
      updateDetails(newIndex, true);

      // Check fallback
      const targetRig = rigs[newIndex];
      if (targetRig.failed) {
        fallbackEl.src = targetRig.bird.image;
        fallbackEl.style.display = 'block';
      } else {
        fallbackEl.style.display = 'none';
      }

      if (!targetRig.loaded && !targetRig.failed) {
        loaderEl.classList.add('visible');
        loadBirdModel(newIndex).then(() => {
          loaderEl.classList.remove('visible');
        });
      }

      // Target reset
      targetZoom = 1.0;
      targetRig.spin.quaternion.copy(homeQuat);
      targetRig.spinVel.set(0, 0);

      // Ground shadow fade
      shadowEl.classList.add('switching');
      setTimeout(() => shadowEl.classList.remove('switching'), 780);

      const dir = Math.sign(newIndex - oldIndex);
      tabSwitch = {
        from: oldIndex,
        to: newIndex,
        dir,
        start: performance.now(),
        duration: 780
      };
    }

    tabHoopoe.addEventListener('click', () => switchTab(0));
    tabKingfisher.addEventListener('click', () => switchTab(1));

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') switchTab(0);
      if (e.key === 'ArrowRight') switchTab(1);
    });

    // POINTER INTERACTIONS (3D Rotation, Inertia, Pinch)
    let isDragging = false;
    let lastPointerPos = { x: 0, y: 0 };
    let pointerVelocity = { x: 0, y: 0 };
    let initialPinchDist = null;
    let initialZoom = 1.0;

    function markInteraction() {
      lastInteractionTime = performance.now();
      if (!hasInteracted) {
        hasInteracted = true;
        hintEl.classList.add('hidden');
      }
    }

    stageEl.addEventListener('pointerdown', (e) => {
      markInteraction();
      stageEl.setPointerCapture(e.pointerId);
      isDragging = true;
      stageEl.classList.add('grabbing');
      lastPointerPos = { x: e.clientX, y: e.clientY };
      pointerVelocity = { x: 0, y: 0 };
      const rig = rigs[activeIndex];
      rig.spinVel.set(0, 0);
    });

    stageEl.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      markInteraction();
      const dx = e.clientX - lastPointerPos.x;
      const dy = e.clientY - lastPointerPos.y;
      lastPointerPos = { x: e.clientX, y: e.clientY };

      pointerVelocity = { x: dx, y: dy };

      const k = Math.PI / Math.max(260, curPx * 1.6);
      const rig = rigs[activeIndex];

      const rotY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx * k);
      const rotX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy * k);

      rig.spin.quaternion.premultiply(rotX);
      rig.spin.quaternion.premultiply(rotY);
    });

    const stopDragging = (e) => {
      if (!isDragging) return;
      isDragging = false;
      stageEl.classList.remove('grabbing');
      try { stageEl.releasePointerCapture(e.pointerId); } catch (_) {}

      // Retain velocity for inertia
      const rig = rigs[activeIndex];
      const k = Math.PI / Math.max(260, curPx * 1.6);
      rig.spinVel.set(pointerVelocity.x * k * 45, pointerVelocity.y * k * 45);
    };

    stageEl.addEventListener('pointerup', stopDragging);
    stageEl.addEventListener('pointercancel', stopDragging);

    // Zoom mouse wheel
    stageEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      markInteraction();
      const factor = e.ctrlKey ? 0.01 : 0.0016;
      targetZoom *= Math.exp(-e.deltaY * factor);
      targetZoom = Math.min(Math.max(targetZoom, 0.55), 3.4);
    }, { passive: false });

    // Touch pinch
    stageEl.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        markInteraction();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        initialPinchDist = Math.hypot(dx, dy);
        initialZoom = targetZoom;
      }
    });

    stageEl.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDist) {
        markInteraction();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        targetZoom = Math.min(Math.max(initialZoom * (dist / initialPinchDist), 0.55), 3.4);
      }
    });

    stageEl.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDist = null;
    });

    // Double click reset & key '0'
    function resetOrientation() {
      markInteraction();
      targetZoom = 1.0;
      const rig = rigs[activeIndex];
      rig.spinVel.set(0, 0);
      rig.spin.quaternion.slerp(homeQuat, 1.0);
    }

    stageEl.addEventListener('dblclick', resetOrientation);

    stageEl.addEventListener('keydown', (e) => {
      markInteraction();
      const rig = rigs[activeIndex];
      if (e.key === '0') resetOrientation();
      if (e.key === '+' || e.key === '=') targetZoom = Math.min(targetZoom * 1.2, 3.4);
      if (e.key === '-' || e.key === '_') targetZoom = Math.max(targetZoom / 1.2, 0.55);

      const rad = 0.18;
      if (e.key === 'ArrowUp') rig.spin.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -rad));
      if (e.key === 'ArrowDown') rig.spin.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), rad));
      if (e.key === 'ArrowLeft') rig.spin.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -rad));
      if (e.key === 'ArrowRight') rig.spin.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), rad));
    });

    // Turn pill buttons
    document.getElementById('btn-turn-ccw').addEventListener('click', () => {
      markInteraction();
      turnQueue -= Math.PI * 0.5;
    });
    document.getElementById('btn-turn-cw').addEventListener('click', () => {
      markInteraction();
      turnQueue += Math.PI * 0.5;
    });
    document.getElementById('btn-turn-360').addEventListener('click', () => {
      markInteraction();
      turnQueue += Math.PI * 2;
    });

    // Icon rail buttons
    btnZoomIn.addEventListener('click', () => {
      markInteraction();
      targetZoom = Math.min(targetZoom * 1.35, 3.4);
    });
    btnZoomOut.addEventListener('click', () => {
      markInteraction();
      targetZoom = Math.max(targetZoom / 1.35, 0.55);
    });

    btnExpand.addEventListener('click', () => {
      markInteraction();
      isFocus = !isFocus;
      heroEl.classList.toggle('focus', isFocus);
      btnExpand.setAttribute('aria-pressed', isFocus ? 'true' : 'false');
      btnExpand.classList.toggle('on', isFocus);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isFocus) {
        isFocus = false;
        heroEl.classList.remove('focus');
        btnExpand.setAttribute('aria-pressed', 'false');
        btnExpand.classList.remove('on');
      }
    });

    // Light button
    btnLight.addEventListener('click', () => {
      markInteraction();
      isDusk = !isDusk;
      heroEl.setAttribute('data-light', isDusk ? 'dusk' : 'day');
      document.body.style.backgroundColor = isDusk ? '#14170f' : '#f6f1e7';
      btnLight.setAttribute('aria-pressed', isDusk ? 'true' : 'false');
      btnLight.classList.toggle('on', isDusk);
    });

    // Close-up button
    btnCloseUp.addEventListener('click', () => {
      markInteraction();
      targetZoom = curZoom > 2.2 ? 1.0 : 2.6;
    });

    // Initial setup
    updateTabs();
    updateDetails(activeIndex, false);
    loaderEl.classList.add('visible');

    // Load active model first, preload other in background
    loadBirdModel(activeIndex).then(() => {
      loaderEl.classList.remove('visible');
      // Preload other
      loadBirdModel(0);
    });

    // ANIMATION & RENDER LOOP
    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // 1. Framing calculation
      let targetCx, targetCy, targetPx;
      if (isFocus) {
        targetCx = heroW * 0.5;
        targetCy = heroH * 0.5;
        targetPx = Math.min(heroW * 0.5, heroH * 0.6) * 1.16;
      } else {
        targetCx = stageBounds.x + stageBounds.w * 0.5;
        targetCy = stageBounds.y + stageBounds.h * 0.44;
        targetPx = Math.min(stageBounds.w * 0.5, stageBounds.h * 0.6) * 1.16;
      }

      const easeF = 1 - Math.exp(-dt * 7);
      curCx += (targetCx - curCx) * easeF;
      curCy += (targetCy - curCy) * easeF;
      curPx += (targetPx - curPx) * easeF;

      const zoomRate = 6;
      curZoom += (targetZoom - curZoom) * (1 - Math.exp(-dt * zoomRate));

      // Update button states
      btnZoomIn.classList.toggle('on', curZoom >= 1.0);
      btnZoomOut.classList.toggle('on', curZoom < 1.0);
      btnCloseUp.setAttribute('aria-pressed', curZoom > 2.2 ? 'true' : 'false');

      // Camera Z and setViewOffset
      const fovRad = (camera.fov * Math.PI) / 180;
      camera.position.z = heroH / (2 * Math.tan(fovRad / 2) * curPx * curZoom);
      camera.setViewOffset(heroW, heroH, heroW / 2 - curCx, heroH / 2 - curCy, heroW, heroH);
      camera.updateProjectionMatrix();

      // 2. Consume Turn Queue
      if (Math.abs(turnQueue) > 0.0001) {
        const step = turnQueue * (1 - Math.exp(-dt * 4.2));
        turnQueue -= step;
        const rig = rigs[activeIndex];
        const qStep = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), step);
        rig.spin.quaternion.premultiply(qStep);
      }

      // 3. Inertia Decay
      if (!isDragging) {
        const rig = rigs[activeIndex];
        if (rig.spinVel.lengthSq() > 0.00001) {
          const rotY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), rig.spinVel.x * dt);
          const rotX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), rig.spinVel.y * dt);
          rig.spin.quaternion.premultiply(rotX);
          rig.spin.quaternion.premultiply(rotY);

          rig.spinVel.multiplyScalar(Math.exp(-dt * 4.5));
        }
      }

      // 4. Light Easing
      const lightRate = 1 - Math.exp(-dt * 4);
      if (isDusk) {
        scene.environmentIntensity += (0.28 - scene.environmentIntensity) * lightRate;
        renderer.toneMappingExposure += (1.0 - renderer.toneMappingExposure) * lightRate;
        keyLight.intensity += (2.6 - keyLight.intensity) * lightRate;
        keyLight.color.lerp(new THREE.Color(0xffc98a), lightRate);
        rimLight.intensity += (1.9 - rimLight.intensity) * lightRate;
      } else {
        scene.environmentIntensity += (0.95 - scene.environmentIntensity) * lightRate;
        renderer.toneMappingExposure += (1.05 - renderer.toneMappingExposure) * lightRate;
        keyLight.intensity += (1.6 - keyLight.intensity) * lightRate;
        keyLight.color.lerp(new THREE.Color(0xfff4e2), lightRate);
        rimLight.intensity += (0.5 - rimLight.intensity) * lightRate;
      }

      // 5. Idle life (sway + hover)
      const t = now * 0.001;
      const idleTime = (now - lastInteractionTime) * 0.001;
      const idleWeight = reducedMotion ? 0 : Math.min(Math.max((idleTime - 1.8) / 1.5, 0), 1);

      rigs.forEach((r, idx) => {
        if (!tabSwitch && idx === activeIndex) {
          r.pivot.rotation.y = Math.sin(t * 0.55) * 0.16 * idleWeight;
          r.pivot.rotation.x = Math.sin(t * 0.9) * 0.03 * idleWeight;
          r.pivot.position.y = Math.sin(t * 1.3 + idx) * 0.028;
          r.pivot.position.x = 0;
          r.pivot.scale.setScalar(1);
        } else if (!tabSwitch) {
          r.pivot.scale.setScalar(0);
        }
      });

      // 6. Tab Switch Animation
      if (tabSwitch) {
        const elapsed = now - tabSwitch.start;
        const progress = Math.min(elapsed / tabSwitch.duration, 1);
        const slide = (stageBounds.w * 0.95) / curPx;

        // Outgoing bird over 60% with cubic ease-in
        const fromRig = rigs[tabSwitch.from];
        const outProgress = Math.min(progress / 0.6, 1);
        const outE = Math.pow(outProgress, 3);
        fromRig.pivot.scale.setScalar(Math.max(1 - outE, 0));
        fromRig.pivot.position.x = -tabSwitch.dir * outE * slide;
        fromRig.pivot.rotation.y = -tabSwitch.dir * outE * 1.4;

        // Incoming bird over full duration with outBack curve
        const toRig = rigs[tabSwitch.to];
        const inE = 1 - Math.pow(1 - progress, 3);
        const u = progress - 1;
        const outBack = 1 + 2.2 * Math.pow(u, 3) + 1.2 * Math.pow(u, 2);

        toRig.pivot.scale.setScalar(Math.max(outBack * (0.25 + 0.75 * inE), 0));
        toRig.pivot.position.x = tabSwitch.dir * (1 - inE) * slide;
        toRig.pivot.rotation.y = tabSwitch.dir * (1 - inE) * 1.6;

        if (progress >= 1) {
          tabSwitch = null;
          fromRig.pivot.scale.setScalar(0);
          toRig.pivot.position.x = 0;
          toRig.pivot.rotation.y = 0;
          toRig.pivot.scale.setScalar(1);
        }
      }

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
